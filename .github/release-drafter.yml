name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Breaking changes"
    labels:
      - "major"
      - "breaking-change"
  - title: "Features"
    labels:
      - "enhancement"
      - "minor"
  - title: "Fixes"
    labels:
      - "bug"
      - "patch"
  - title: "Documentation"
    labels:
      - "documentation"
  - title: "Maintenance"
    labels:
      - "chore"

version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
  minor:
    labels:
      - "enhancement"
      - "minor"
  patch:
    labels:
      - "bug"
      - "documentation"
      - "patch"
      - "chore"
  default: patch

template: |
  ## Changes

  $CHANGES

exclude-labels:
  - "skip-changelog"
